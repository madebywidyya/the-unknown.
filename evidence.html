<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evidence Room — THE UNKNOWN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/investigation.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">U<span>.</span></span><span class="brand-name">THE <b>UNKNOWN</b><small>INVESTIGATION ARCHIVE</small></span></a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">☰</button>
    <nav class="main-nav" id="mainNav">
      <a href="cases.html">THE ARCHIVE</a>
      <a href="dashboard.html">DASHBOARD</a>
      <a href="evidence.html">EVIDENCE</a>
      <a href="challenges.html">CHALLENGES</a>
      <a href="map.html">MAP</a>
      <a href="about.html">ABOUT</a>
      <a class="nav-cta" href="investigation-board.html">BOARD <span>↗</span></a>
    </nav>
  </header>
  <main class="page-main">
    <div class="page-header">
      <p class="eyebrow"><span class="live-dot"></span> EVIDENCE ROOM</p>
      <h1>Collected <em>Evidence</em></h1>
      <p>All discovered items appear here. Open a case file and use the Discover buttons to collect evidence.</p>
    </div>
    <div id="evidenceList" class="case-list"></div>
  </main>
  <footer class="site-footer">
    <a class="brand" href="index.html"><span class="brand-mark">U<span>.</span></span><span class="brand-name">THE <b>UNKNOWN</b></span></a>
    <span>© 2026 THE UNKNOWN ARCHIVE</span>
    <a href="dashboard.html">DASHBOARD</a>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/storage.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/navigation.js"></script>
  <script>
    (async () => {
      let evidence = [];
      try {
        const res = await fetch('data/evidence.json');
        evidence = await res.json();
      } catch (e) {}
      const list = document.getElementById('evidenceList');
      const discovered = evidence.filter(e => Storage.hasEvidence(e.id));
      const locked = evidence.filter(e => !Storage.hasEvidence(e.id));
      if (!discovered.length && !locked.length) {
        list.innerHTML = '<p class="empty-state">No evidence data loaded.</p>';
        return;
      }
      list.innerHTML = `
        <h2 style="font-size:12px;letter-spacing:1.5px;color:var(--gold);margin-bottom:12px">DISCOVERED (${discovered.length})</h2>
        ${discovered.map(e => `
          <article class="case-row">
            <div class="case-id" style="font-size:12px">${e.id}</div>
            <div>
              <h3 style="font-size:16px">${e.name}</h3>
              <div class="meta">${e.type} · Case ${e.caseId}</div>
              <p style="font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5">${e.description}</p>
              ${e.analysis ? `<p style="font-size:11px;color:var(--gold-dim);margin:6px 0 0"><em>Analysis:</em> ${e.analysis}</p>` : ''}
            </div>
            <div class="actions"><span class="badge badge-done">FOUND</span></div>
          </article>
        `).join('') || '<p class="empty-state">No evidence discovered yet. Open a case and look for Discover buttons.</p>'}
        <h2 style="font-size:12px;letter-spacing:1.5px;color:var(--muted-2);margin:28px 0 12px">STILL HIDDEN (${locked.length})</h2>
        ${locked.map(e => `
          <article class="case-row locked">
            <div class="case-id" style="font-size:12px">${e.id}</div>
            <div>
              <h3 style="font-size:16px">${e.name}</h3>
              <div class="meta">Case ${e.caseId} · Not yet discovered</div>
            </div>
            <div class="actions"><span class="badge badge-locked">LOCKED</span></div>
          </article>
        `).join('')}
      `;
    })();
  </script>
</body>
</html>
